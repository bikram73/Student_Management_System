[build]
  command = "API_BASE_VALUE=\"${API_BASE_URL:-${API_BASE:-/api}}\"; printf \"window.API_BASE='%s';\\n\" \"$API_BASE_VALUE\" > frontend/js/config.js"
  publish = "frontend"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
