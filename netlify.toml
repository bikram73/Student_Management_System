[build]
  command = "API_BASE=${API_BASE:-http://localhost:5000/api}; printf \"window.API_BASE='%s';\\n\" \"$API_BASE\" > frontend/js/config.js"
  publish = "frontend"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
